name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bash -n deploy/install.sh deploy/display-start.sh deploy/display-client.sh deploy/hotspot-start.sh
      - run: node --check static/app.js && node --check static/admin.js && node --check static/photo_login.js && node --check static/files.js
